<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculator</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#0f172a;
      color:white;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:500px;
      background:#111827;
      border:1px solid #1f2937;
      border-radius:20px;
      padding:30px;
      box-shadow:0 10px 40px rgba(0,0,0,0.5);
    }

    h1{
      text-align:center;
      margin-bottom:25px;
      font-size:30px;
      letter-spacing:1px;
    }

    .input-group{
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    input,
    select{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#1e293b;
      color:white;
      font-size:16px;
      outline:none;
    }

    input::placeholder{
      color:#94a3b8;
    }

    button{
      padding:14px;
      border:none;
      border-radius:12px;
      background:linear-gradient(135deg,#3b82f6,#2563eb);
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      transform:translateY(-2px);
      opacity:0.95;
    }

    .logs{
      margin-top:25px;
      background:#020617;
      padding:15px;
      border-radius:12px;
      min-height:150px;
      max-height:220px;
      overflow-y:auto;
      font-family:monospace;
      font-size:14px;

      /* hidden initially */
      display:none;
    }

    .log{
      margin-bottom:10px;
      color:#38bdf8;
      animation:fadeIn 0.4s ease;
    }

    .result{
      margin-top:20px;
      padding:15px;
      border-radius:12px;
      background:#1e293b;
      text-align:center;
      font-size:24px;
      font-weight:bold;
      color:#22c55e;
      display:none;
      animation:fadeIn 0.5s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(5px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>Calculator</h1>

    <div class="input-group">

      <input 
        type="number" 
        id="num1" 
        placeholder="Enter first number"
      >

      <select id="operator">
        <option value="+">Addition (+)</option>
        <option value="-">Subtraction (-)</option>
        <option value="*">Multiplication (×)</option>
        <option value="/">Division (÷)</option>
      </select>

      <input 
        type="number" 
        id="num2" 
        placeholder="Enter second number"
      >

      <button onclick="calculate()">
        Calculate
      </button>

    </div>

    <div class="logs" id="logs"></div>

    <div class="result" id="result"></div>

  </div>

  <script>

    async function calculate(){

      const num1 = document.getElementById("num1").value;
      const num2 = document.getElementById("num2").value;

      const logs = document.getElementById("logs");
      const result = document.getElementById("result");

      // show logs only after clicking
      logs.style.display = "block";

      // reset previous data
      logs.innerHTML = "";
      result.style.display = "none";

      const messages = [
        "Initializing AI core...",
        "Fetching data from NASA servers...",
        "Installing Einstein mind module...",
        "Reading secret NASA research papers...",
        "Optimizing multiverse calculations...",
        "Decrypting alien mathematics...",
        "Finalizing calculations..."
      ];

      // slower logs
      for(let i = 0; i < messages.length; i++){

        await new Promise(resolve => setTimeout(resolve, 1200));

        const log = document.createElement("div");

        log.className = "log";

        log.innerText = "> " + messages[i];

        logs.appendChild(log);

        logs.scrollTop = logs.scrollHeight;
      }

      // wait little more before result
      await new Promise(resolve => setTimeout(resolve, 1200));

      result.style.display = "block";

      result.innerText = "Hello World";

    }

  </script>

</body>
</html>
